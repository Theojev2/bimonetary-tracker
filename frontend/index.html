
<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#000000">

    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="manifest" href="manifest.json">

    <link rel="apple-touch-icon" href="icon.svg">

    

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>

    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>



    <title>Finanzas Bimonetarias PWA</title>

    <style>

        :root {

            --bg: #000000;

            --surface: #1c1c1e;

            --surface-hover: #2c2c2e;

            --text-main: #ffffff;

            --text-sec: #8e8e93;

            --accent: #d4af37;

            --accent-glow: rgba(212, 175, 55, 0.4);

            --border: #38383a;

            --danger: #ff453a;

        }

        

        body {

            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

            background-color: var(--bg);

            color: var(--text-main);

            margin: 0; padding: 20px 20px 40px 20px;

            -webkit-font-smoothing: antialiased;

            overflow-x: hidden;

        }



        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }

        .header-date { font-weight: 700; font-size: 20px; color: var(--text-main); }

        .header-actions { display: flex; gap: 8px; align-items: center; }

        .header-rate { font-size: 13px; font-weight: 600; color: var(--accent); background: rgba(212, 175, 55, 0.1); padding: 6px 12px; border-radius: 12px; display: flex; align-items: center; gap: 4px;}

        

        .voice-btn {

            background: rgba(255, 255, 255, 0.1); border: 1px solid var(--border); color: #fff;

            width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center;

            cursor: pointer; transition: all 0.2s; font-size: 18px;

        }

        .voice-btn:active { transform: scale(0.9); background: var(--accent); color: #000; }

        .voice-btn.listening { background: var(--danger); animation: pulse 1.5s infinite; }



        @keyframes pulse {

            0% { box-shadow: 0 0 0 0 rgba(255, 69, 58, 0.4); }

            70% { box-shadow: 0 0 0 10px rgba(255, 69, 58, 0); }

            100% { box-shadow: 0 0 0 0 rgba(255, 69, 58, 0); }

        }



        .ring-container { position: relative; width: 100%; max-width: 320px; aspect-ratio: 1; margin: 0 auto 40px auto; }

        

        .chart-ring {

            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);

            width: 58%; height: 58%; border-radius: 50%;

            background: conic-gradient(var(--border) 0% 100%);

            z-index: 1; transition: background 0.5s ease-out;

            box-shadow: 0 0 25px var(--accent-glow);

        }



        .center-display {

            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);

            width: 52%; height: 52%; background: var(--surface); border-radius: 50%;

            display: flex; flex-direction: column; justify-content: center; align-items: center; 

            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5); z-index: 2;

        }

        

        .center-label { font-size: 11px; color: var(--text-sec); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px;}

        .center-usd { font-size: 26px; font-weight: 700; color: var(--text-main); margin: 0;}

        .center-ves { font-size: 12px; color: var(--accent); font-weight: 600; margin-top: 4px;}



        .cat-btn {

            position: absolute; transform: translate(-50%, -50%); background: var(--surface);

            border: 1px solid var(--border); border-radius: 50%; width: 68px; height: 68px;

            display: flex; flex-direction: column; justify-content: center; align-items: center;

            color: var(--text-sec); box-shadow: 0 8px 16px rgba(0,0,0,0.4); transition: all 0.2s; cursor: pointer; z-index: 10;

        }

        .cat-btn:active { transform: translate(-50%, -50%) scale(0.9); }

        .cat-btn ion-icon { font-size: 24px; margin-bottom: 4px; }

        .cat-btn span { font-size: 10px; font-weight: 600; }



        .pos-1 { top: 0%; left: 50%; }     

        .pos-2 { top: 38%; left: 95%; }    

        .pos-3 { top: 90%; left: 79%; }    

        .pos-4 { top: 90%; left: 21%; }    

        .pos-5 { top: 38%; left: 5%; }     



        .list-header { font-size: 16px; font-weight: 600; margin: 10px 0 15px 5px; color: var(--text-sec); }

        .expense-item {

            background: var(--surface); border-radius: 16px; padding: 15px; margin-bottom: 10px;

            display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border);

        }

        .ex-info { flex: 1; display: flex; align-items: center; gap: 12px; }

        .ex-icon { background: #000; padding: 12px; border-radius: 12px; display: flex; font-size: 20px;}

        .ex-title { font-weight: 600; font-size: 15px; display: block; }

        .ex-desc { font-size: 12px; color: var(--text-sec); margin-top: 2px;}

        .ex-amount { text-align: right; }

        .ex-usd { font-weight: 700; font-size: 15px; }

        .ex-ves { font-size: 12px; color: var(--text-sec); margin-top: 2px;}

        .btn-delete { width: 36px; height: 36px; padding: 0; margin-left: 10px; background: transparent; color: var(--danger); border-radius: 10px; border: none;}

        .btn-delete:active { background: rgba(255, 69, 58, 0.15); transform: scale(0.85); }

        .btn-delete ion-icon { font-size: 22px; }



        .modal-overlay {

            position: fixed; top: 0; left: 0; width: 100%; height: 100%;

            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: flex-end;

            opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 100;

        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {

            background: var(--surface); width: 100%; border-radius: 24px 24px 0 0; padding: 25px 25px 35px 25px;

            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); box-sizing: border-box;

            border-top: 1px solid var(--border);

        }

        .modal-overlay.active .modal-content { transform: translateY(0); }

        

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;}

        .modal-title { font-size: 20px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px;}

        .close-btn { background: #38383a; border: none; color: #fff; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer;}

        

        .input-group { position: relative; margin-bottom: 12px; display: flex; align-items: center; }

        .input-group ion-icon { position: absolute; left: 14px; color: var(--text-sec); font-size: 20px; transition: color 0.3s;}

        input {

            width: 100%; padding: 16px 16px 16px 42px; border-radius: 12px; border: 1px solid var(--border);

            background-color: #000; color: #fff; font-size: 16px; font-family: inherit; box-sizing: border-box; -webkit-appearance: none; transition: all 0.3s;

        }

        input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }

        input:focus + ion-icon { color: var(--accent); }



        .amount-display {

            flex: 1; padding: 16px 16px 16px 42px; border-radius: 12px; border: 1px solid var(--border);

            background-color: #000; color: #fff; font-size: 18px; font-weight: 600; font-family: inherit; 

            box-sizing: border-box; display: flex; align-items: center; min-height: 53px; overflow: hidden;

        }

        .amount-display.empty { color: var(--text-sec); font-weight: 400; font-size: 16px; }

        

        .currency-toggle {

            display: flex; width: 100px; background-color: #000; border-radius: 12px;

            border: 1px solid var(--border); overflow: hidden;

        }

        .curr-btn {

            flex: 1; display: flex; justify-content: center; align-items: center;

            font-size: 15px; font-weight: 600; color: var(--text-sec);

            cursor: pointer; transition: all 0.2s;

        }

        .curr-btn.active { background-color: var(--accent); color: #000; }



        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }

        .key-btn {

            background-color: var(--bg); color: var(--text-main); border: 1px solid var(--border);

            border-radius: 12px; padding: 12px 0; font-size: 22px; font-weight: 600;

            display: flex; justify-content: center; align-items: center; cursor: pointer;

            transition: background-color 0.1s, transform 0.1s; user-select: none;

        }

        .key-btn:active { background-color: var(--surface-hover); transform: scale(0.95); }

        .key-btn.key-action { color: var(--accent); }

        .key-btn.key-del { color: var(--danger); font-size: 26px; }



        .live-calc { font-size: 14px; color: var(--accent); margin-top: -5px; margin-bottom: 15px; text-align: right; font-weight: 600; min-height: 17px; }

        .btn-save { width: 100%; background-color: var(--accent); color: #000; border: none; padding: 16px; border-radius: 12px; font-size: 17px; font-weight: 700; cursor: pointer; transition: transform 0.2s;}

        .btn-save:active { transform: scale(0.96); opacity: 0.9; }

    </style>

    <link rel="manifest" href="manifest.json">
</head>

<body>



    <div class="header">

        <div class="header-date" id="date-display">--/--/----</div>

        <div class="header-actions">

            <button class="voice-btn" id="voice-trigger" onclick="startVoiceRecognition()" title="Dictar Gasto"><ion-icon name="mic-outline"></ion-icon></button>

            <div class="header-rate" id="rate-display"><ion-icon name="swap-horizontal"></ion-icon> Cargando...</div>

        </div>

    </div>



    <div class="ring-container">

        <div class="chart-ring" id="category-chart"></div>



        <div class="center-display">

            <span class="center-label">Gasto del Mes</span>

            <div class="center-usd" id="total-usd">$0.00</div>

            <div class="center-ves" id="total-ves">Bs. 0.00</div>

        </div>



        <!-- Categorías genéricas para el repositorio público -->

        <div class="cat-btn pos-1" onclick="openModal('Comida', 'restaurant-outline', '#ff5964')"><ion-icon name="restaurant-outline" style="color:#ff5964"></ion-icon><span>Comida</span></div>

        <div class="cat-btn pos-2" onclick="openModal('Casa', 'home-outline', '#38b000')"><ion-icon name="home-outline" style="color:#38b000"></ion-icon><span>Casa</span></div>

        <div class="cat-btn pos-3" onclick="openModal('Servicios', 'flash-outline', '#f77f00')"><ion-icon name="flash-outline" style="color:#f77f00"></ion-icon><span>Servicios</span></div>

        <div class="cat-btn pos-4" onclick="openModal('Transporte', 'car-sport-outline', '#48cae4')"><ion-icon name="car-sport-outline" style="color:#48cae4"></ion-icon><span>Transporte</span></div>

        <div class="cat-btn pos-5" onclick="openModal('Otros', 'apps-outline', '#b5179e')"><ion-icon name="apps-outline" style="color:#b5179e"></ion-icon><span>Otros</span></div>

    </div>



    <div class="list-header" id="list-title">Movimientos Recientes</div>

    <div id="expenses-list">

        <p style="color: var(--text-sec); text-align: center; font-size: 14px; margin-top: 20px;">Cargando historial...</p>

    </div>



    <div class="modal-overlay" id="expense-modal">

        <div class="modal-content">

            <div class="modal-header">

                <div class="modal-title" id="modal-title-text"><ion-icon name="pricetag"></ion-icon> Categoría</div>

                <button class="close-btn" onclick="closeModal()"><ion-icon name="close"></ion-icon></button>

            </div>

            

            <div id="expense-form-container">

                <input type="hidden" id="category" value="">

                

                <div class="input-group">

                    <ion-icon name="document-text-outline"></ion-icon>

                    <input type="text" id="desc-nota" placeholder="Nota opcional (ej. Almuerzo)" autocomplete="off">

                </div>

                

                <div style="display: flex; gap: 10px; margin-bottom: 5px;">

                    <div class="input-group" style="flex: 1; margin-bottom: 0;">

                        <ion-icon name="cash-outline"></ion-icon>

                        <div id="amount-display" class="amount-display empty">Monto</div>

                    </div>

                    

                    <div class="currency-toggle">

                        <div class="curr-btn active" onclick="setCurrency('USD', this)">USD</div>

                        <div class="curr-btn" onclick="setCurrency('VES', this)">Bs</div>

                    </div>

                    <input type="hidden" id="currency" value="USD">

                </div>

                

                <div id="live-calc" class="live-calc"></div>



                <div class="keypad">

                    <div class="key-btn" onclick="pressKey('1')">1</div>

                    <div class="key-btn" onclick="pressKey('2')">2</div>

                    <div class="key-btn" onclick="pressKey('3')">3</div>

                    <div class="key-btn" onclick="pressKey('4')">4</div>

                    <div class="key-btn" onclick="pressKey('5')">5</div>

                    <div class="key-btn" onclick="pressKey('6')">6</div>

                    <div class="key-btn" onclick="pressKey('7')">7</div>

                    <div class="key-btn" onclick="pressKey('8')">8</div>

                    <div class="key-btn" onclick="pressKey('9')">9</div>

                    <div class="key-btn key-action" onclick="pressKey('.')">.</div>

                    <div class="key-btn" onclick="pressKey('0')">0</div>

                    <div class="key-btn key-del" onclick="pressKey('del')"><ion-icon name="backspace-outline"></ion-icon></div>

                </div>

                

                <button type="button" class="btn-save" id="save-btn" onclick="saveExpense()">Guardar Movimiento</button>

            </div>

        </div>

    </div>



    <script src="app.js"></script>

</body>

</html>
